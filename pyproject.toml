[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myutils"
version = "0.2.0"
description = "utilities, including notebook ↔ text conversion."
requires-python = ">=3.9"
dependencies = [
    "nbformat>=5.0",
]

[project.scripts]
nbtext = "myutils.nbtext:main"
fsdump = "myutils.fsdump:main"
